server {
    listen 80;
    server_name gsap.wetogether.best;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check endpoint
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Never expose hidden files, metadata, or backup files.
    location ~* (^|/)\.(?!well-known(?:/|$)) {
        return 404;
    }

    location ~* (?:^|/)(?:server-status|\.env(?:\..*)?|.*\.(?:bak|conf|config|key|log|old|orig|save|secret|sql|swp|tmp|yml|yaml))(?:$|/) {
        return 404;
    }

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML no caching
    location ~* \.html$ {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Existing files are served directly; extensionless paths are SPA routes.
    location / {
        try_files $uri $uri/ @spa;
    }

    location @spa {
        if ($uri ~ \.) {
            return 404;
        }
        try_files /index.html =404;
    }
}
